backend:
  name: github
  repo: mondinellisg-prog/laestacion
  branch: main

media_folder: "assets/productos"
public_folder: "assets/productos"

collections:
  - name: "menu"
    label: "Productos y Precios"
    label_singular: "Producto"
    file: "content/menu.json"
    identifier_field: "nombre"
    bulk_edit: true
    table_columns:
      - "nombre"
      - "categoria"
      - "piezas"
      - "precio"
      - "stock"
    sortable_fields:
      - "nombre"
      - "precio"
      - "categoria"
      - "stock"
    view_groups:
      - label: "Rubro / Categoría"
        field: "categoria"
      - label: "Estado de Stock"
        field: "stock"
    view_filters:
      - label: "Solo Disponibles"
        field: "stock"
        pattern: "disponible"
      - label: "Agotados"
        field: "stock"
        pattern: "agotado"
    fields:
      - name: "id"
        label: "ID único (slug sin espacios ni tildes)"
        widget: "string"
        hint: "Ejemplo: pechuga-sin-hueso-kg (no lo cambies si ya existe para mantener la fusión CSV)"
      - name: "nombre"
        label: "Nombre del Producto"
        widget: "string"
      - name: "piezas"
        label: "Presentación / Peso / Unidad"
        widget: "string"
        required: false
        hint: "Ej: x 1 kg, x 200 g, 1.5 L, x 12 u."
      - name: "precio"
        label: "Precio (ARS entero sin puntos)"
        widget: "number"
        value_type: "int"
        min: 0
      - name: "categoria"
        label: "Categoría / Rubro"
        widget: "relation"
        collection: "categorias"
        value_field: "id"
        display_fields:
          - "nombre"
        search_fields:
          - "nombre"
          - "id"
      - name: "stock"
        label: "Stock"
        widget: "select"
        options:
          - label: "Disponible"
            value: "disponible"
          - label: "Agotado"
            value: "agotado"
        default: "disponible"
      - name: "etiquetas"
        label: "Etiquetas destacadas"
        widget: "select"
        multiple: true
        required: false
        options:
          - "Más Elegido"
          - "Favorito"
          - "Oferta"
          - "Fresco"
          - "Sin TACC"
          - "Familiar"
          - "Veggie"
      - name: "descripcion"
        label: "Descripción breve"
        widget: "text"
        required: false
      - name: "imagen"
        label: "Foto del producto (opcional)"
        widget: "image"
        required: false

  - name: "categorias"
    label: "Categorías / Rubros"
    label_singular: "Categoría"
    file: "content/categorias.json"
    identifier_field: "nombre"
    bulk_edit: true
    table_columns:
      - "emoji"
      - "nombre"
      - "id"
    fields:
      - name: "id"
        label: "ID interno (sin espacios ni tildes)"
        widget: "string"
      - name: "nombre"
        label: "Nombre visible del rubro"
        widget: "string"
      - name: "emoji"
        label: "Emoji"
        widget: "string"
        required: false

singletons:
  - name: "config"
    label: "Configuración del Local"
    file: "content/config.json"
    fields:
      - name: "local_abierto"
        label: "¿El local está abierto ahora?"
        widget: "boolean"
        default: true
      - name: "demora_estimada"
        label: "Demora estimada de preparación / envío"
        widget: "string"
        default: "30 a 45 min"
      - name: "aviso_del_dia"
        label: "Aviso o promo del día (dejar vacío para ocultar)"
        widget: "text"
        required: false
      - name: "descuento_efectivo"
        label: "% Descuento en Efectivo"
        widget: "number"
        value_type: "int"
        min: 0
        max: 90
        default: 5
      - name: "descuento_transferencia"
        label: "% Descuento en Transferencia"
        widget: "number"
        value_type: "int"
        min: 0
        max: 90
        default: 0
      - name: "descuento_primer_pedido"
        label: "% Descuento Primer Pedido Web"
        widget: "number"
        value_type: "int"
        min: 0
        max: 90
        default: 5
      - name: "whatsapp"
        label: "WhatsApp de recepción (código país sin + ni espacios)"
        widget: "string"
        hint: "Ejemplo Argentina: 5491122334455"
      - name: "apps_script_url"
        label: "URL Web App de Google Apps Script (/exec)"
        widget: "string"
        required: false
