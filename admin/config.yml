backend:
  name: github
  repo: mondinellisg-prog/sushi-garden
  branch: main

media_folder: "assets/productos"
public_folder: "assets/productos"

collections:
  - name: menu
    label: "Menú y Platos"
    label_singular: "Plato"
    file: "content/menu.json"
    identifier_field: nombre
    create: true
    delete: true
    bulk_edit: true
    table_columns:
      - nombre
      - categoria
      - piezas
      - precio
      - stock
    sortable_fields:
      fields:
        - nombre
        - precio
        - categoria
        - stock
    view_groups:
      default: categoria
      groups:
        - name: categoria
          label: Categoría
          field: categoria
        - name: stock
          label: Stock
          field: stock
    view_filters:
      - label: Disponibles
        field: stock
        pattern: "^disponible$"
      - label: Agotados
        field: stock
        pattern: "^agotado$"
    fields:
      - name: id
        label: "ID Único"
        widget: string
        hint: "Sin espacios ni tildes (ej: combo-x-20). Se usa para fusionar precios masivos."
      - name: nombre
        label: "Nombre del Plato"
        widget: string
      - name: piezas
        label: "Piezas / Medida"
        widget: string
        required: false
        hint: "Ej: x4, x8, 20 piezas, 1 porción"
      - name: descripcion
        label: "Descripción"
        widget: text
        required: false
      - name: precio
        label: "Precio (ARS entero sin puntos)"
        widget: number
        value_type: int
        min: 0
      - name: categoria
        label: "Categoría"
        widget: relation
        collection: categorias
        value_field: id
        display_fields:
          - nombre
        search_fields:
          - nombre
          - id
      - name: etiquetas
        label: "Etiquetas"
        widget: select
        multiple: true
        required: false
        options:
          - "Más Elegido"
          - "Favorito"
          - "Sin TACC"
          - "Veggie"
          - "Hot"
          - "Salmón"
      - name: stock
        label: "Stock"
        widget: select
        default: "disponible"
        options:
          - { label: "Disponible", value: "disponible" }
          - { label: "Agotado", value: "agotado" }
      - name: imagen
        label: "Foto del Producto"
        widget: image
        required: false

  - name: categorias
    label: "Categorías"
    label_singular: "Categoría"
    file: "content/categorias.json"
    identifier_field: nombre
    create: true
    delete: true
    table_columns:
      - nombre
      - id
      - emoji
    fields:
      - name: id
        label: "ID (slug)"
        widget: string
        hint: "Sin espacios ni tildes (ej: promos, piezas)"
      - name: nombre
        label: "Nombre Visible"
        widget: string
      - name: emoji
        label: "Emoji / Ícono"
        widget: string
        required: false
        default: "🍣"

singletons:
  - name: config
    label: "Configuración del Local"
    file: "content/config.json"
    fields:
      - { name: local_abierto, label: "Local Abierto", widget: boolean, default: true }
      - { name: demora_estimada, label: "Demora Estimada", widget: string, default: "40 a 60 min" }
      - { name: aviso_del_dia, label: "Aviso del Día", widget: string, required: false }
      - { name: descuento_efectivo, label: "% Descuento Efectivo", widget: number, value_type: int, default: 10, min: 0, max: 100 }
      - { name: descuento_transferencia, label: "% Descuento Transferencia", widget: number, value_type: int, default: 5, min: 0, max: 100 }
      - { name: descuento_primer_pedido, label: "% Descuento Primer Pedido", widget: number, value_type: int, default: 15, min: 0, max: 100 }
      - { name: whatsapp, label: "Número WhatsApp (549...)", widget: string, default: "5491136293941" }
      - { name: apps_script_url, label: "URL Web App Google Apps Script", widget: string, required: false }